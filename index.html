<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yvon MEISTERMANN | ENSEEIHT 3EA</title><link rel="icon" type="image/png" href="favicon.png?v=2">
<style>

/* =====================================================
   1. COULEURS ET RÉGLAGES GÉNÉRAUX
   Pour changer une couleur du site, modifie-la ici.
   ===================================================== */

:root{
--navy:#102747;      /* bleu foncé (menu, titres) */
--blue:#2868ad;      /* bleu principal (boutons, liens) */
--bl:#e7f0fb;        /* bleu très clair (étiquettes) */
--bm:#4a8fd8;        /* bleu moyen */
--red:#d52b3f;       /* rouge (petits traits décoratifs) */
--ink:#1c2b3a;       /* couleur du texte */
--muted:#5f6f80;     /* gris du texte secondaire */
--paper:#f5f8fc;     /* fond de la page */
--line:#dce5ef;      /* bordures */
--r:14px;            /* arrondi des cartes */
--max:1160px;        /* largeur maximale du contenu */
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.65 Inter,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--blue)}
h1,h2,h3,p{margin-top:0}


/* =====================================================
   2. MENU DE NAVIGATION (en haut, reste visible)
   ===================================================== */

header{position:sticky;top:0;z-index:20;color:#fff;background:rgba(16,39,71,.97);border-bottom:3px solid var(--red)}
.nav{max-width:var(--max);min-height:76px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}

/* Logo + nom à gauche */
.brand{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;font-weight:800;line-height:1.2}
.brand img{width:52px;height:52px;object-fit:contain}
.brand small{display:block;margin-top:5px;color:#c8d8eb;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}

/* Liens à droite */
.links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
.links a{padding:9px 11px;border-radius:7px;color:#eaf1fa;text-decoration:none;font-size:.88rem;font-weight:600}
.links a:hover{background:#25466f}


/* =====================================================
   3. ACCUEIL (photo de fond + texte + portrait)
   ===================================================== */

.hero{position:relative;isolation:isolate;overflow:hidden;min-height:680px;display:grid;align-items:center;color:#fff;background:var(--navy)}

/* Photo de fond : le fichier doit s'appeler exactement barrage-chastang.jpg */
.hero:before{content:"";position:absolute;z-index:-2;inset:0;background:url(barrage-chastang.jpg) 70% center/cover no-repeat}

/* Dégradés par-dessus la photo : sombre à gauche (pour lire le texte), clair en bas */
.hero:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(to bottom,transparent 70%,rgba(245,248,252,.15) 88%,#f5f8fc),linear-gradient(to right,rgba(9,26,49,.55),rgba(9,26,49,.35) 35%,rgba(9,26,49,.08) 70%,transparent)}

/* Texte à gauche, portrait à droite */
.hero-in{width:min(100% - 48px,1400px);margin:auto;padding:82px 20px 110px;display:grid;grid-template-columns:1.6fr .65fr;align-items:center;gap:65px}
.hero-photo{width:100%;max-width:250px;aspect-ratio:3/4;object-fit:cover;justify-self:center;border-radius:14px;border:2px solid #ffffff80;box-shadow:0 18px 45px #00000035}

/* Petite ligne au-dessus du nom */
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:#d8e7f8;font-size:.82rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eyebrow:before{content:"";width:28px;height:3px;background:var(--red)}

h1{max-width:780px;margin-bottom:20px;font-size:clamp(2.6rem,6vw,5.2rem);line-height:1.02;letter-spacing:-.045em}
.lead{max-width:690px;color:#e0e9f5;font-size:clamp(1.05rem,2vw,1.25rem)}

/* Phrase de présentation (UVP) avec trait rouge */
.uvp{max-width:690px;margin:18px 0 0;padding-left:14px;border-left:3px solid var(--red);color:#fff;font-weight:600}


/* =====================================================
   4. SECTIONS ET TITRES
   ===================================================== */

.section{width:min(100% - 48px,var(--max));margin:auto;padding:82px 0}
.alt{background:#fff}                       /* sections à fond blanc */
.head{max-width:760px;margin-bottom:34px}
.kicker{margin-bottom:8px;color:var(--blue);font-size:.78rem;font-weight:850;letter-spacing:.15em;text-transform:uppercase}
h2{margin-bottom:14px;color:var(--navy);font-size:clamp(2rem,4vw,3rem);line-height:1.12;letter-spacing:-.035em}
.intro{color:var(--muted);font-size:1.08rem}


/* =====================================================
   5. CARTES, GRILLES, ÉTIQUETTES ET BOUTONS
   ===================================================== */

/* g2 = 2 colonnes, g3 = 3 colonnes */
.g2,.g3{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* Une carte */
.card{display:flex;flex-direction:column;min-width:0;padding:25px;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:0 6px 20px #10274709}
.alt .card{background:#fbfdff}
.card h3{margin-bottom:10px;color:var(--navy);font-size:1.25rem;line-height:1.3}
.card p,.card li{color:var(--muted)}

/* Image en haut d'une carte + la ligne de crédit juste dessous */
.card img{width:calc(100% + 50px);height:205px;margin:-25px -25px 6px;object-fit:cover;border-radius:var(--r) var(--r) 0 0;background:#dce7f4}
.credit{margin:0 0 14px;color:#8795a5;font-size:.72rem}
.credit a{color:inherit}

/* Petit titre au-dessus du nom de la carte (ex : PROJECT 01) */
.num{margin-bottom:12px;color:var(--blue);font-size:.82rem;font-weight:850;letter-spacing:.12em}

/* Étiquettes (tags) en bas des cartes */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:16px}
.tag{padding:5px 10px;border-radius:5px;color:#174c85;background:var(--bl);font-size:.78rem;font-weight:750}

/* Boutons : toujours alignés en bas de la carte */
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:18px}
.btn{padding:10px 18px;border-radius:6px;color:#fff;background:var(--blue);font-weight:700;text-decoration:none}
.btn:hover{background:var(--navy)}

/* Bandeau bleu foncé (section Civic Engagement) */
.band{margin-top:22px;padding:38px;border-radius:var(--r);color:#fff;background:var(--navy)}
.band h3{color:#fff;font-size:1.65rem}
.band p{max-width:780px;color:#d5e2f1}
.band .tag{color:#eaf3ff;background:#25466f}

/* Blocs de détail des projets (sous les 3 cartes) */
.proj{margin-top:22px;padding:28px;border:1px solid var(--line);border-radius:var(--r);background:#fbfdff;scroll-margin-top:100px}
.proj h3{margin-bottom:6px;color:var(--navy);font-size:1.4rem}
.proj h4{margin:18px 0 4px;color:var(--blue);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.proj p,.proj li{margin-bottom:6px;color:var(--muted)}

/* Galerie de photos et schémas du projet (clic = image en grand) */
/* Encadré mis en valeur (projet 3) */
.callout{margin:10px 0 0;padding:14px 18px 8px;border-left:4px solid var(--bm);border-radius:0 8px 8px 0;background:#edf4fc}
.callout li{color:#41546a}

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0 4px}
.gallery figure{margin:0}
.gallery img{display:block;width:100%;height:180px;object-fit:cover;border:1px solid var(--line);border-radius:8px}
.gallery .schema img{object-fit:contain;background:#fff}
.gallery figcaption{margin-top:4px;color:var(--muted);font-size:.8rem}


/* =====================================================
   6. PIED DE PAGE
   ===================================================== */

footer{padding:28px 24px;color:#d1ddec;background:#0a1c33;text-align:center;font-size:.88rem}
footer p{margin:0 0 6px}
footer a{color:#a9d1ff}


/* =====================================================
   7. TABLETTES ET TÉLÉPHONES
   ===================================================== */

/* Tablettes : menu sur plusieurs lignes, 2 colonnes de cartes */
@media(max-width:900px){
.nav{flex-direction:column;align-items:flex-start;gap:10px}
.links{justify-content:flex-start}
.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Téléphones : tout sur une seule colonne */
@media(max-width:620px){
.hero{min-height:auto}
.hero-in{width:min(100% - 34px,var(--max));grid-template-columns:1fr;gap:30px;padding:55px 0 85px}
.hero-photo{max-width:200px;margin:auto}
.section{width:min(100% - 34px,var(--max));padding:62px 0}
.g2,.g3{grid-template-columns:1fr}
.band{padding:24px}
.card img{height:185px}
}


#lock{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#102747}
.box{width:min(90%,400px);padding:40px;text-align:center;background:#fff;color:#102747;border-radius:14px;box-shadow:0 15px 40px #00000040}
.box input{width:100%;padding:13px;margin:15px 0;border:1px solid #dce5ef;border-radius:6px;font-size:1rem}
.box button{width:100%;padding:13px;color:#fff;background:#2868ad;border:0;border-radius:6px;font-weight:700;cursor:pointer}
#err{min-height:1.4em;margin:12px 0 0;color:#d52b3f;font-size:.9rem}
</style></head><body id="top">
